# Fine-tuning a candidate. Nothing here runs until P5.
#
# base_model is open-weights and local, and its provider differs from the
# judge's in judges.yaml - integrity.require_distinct_providers, because a judge
# measurably favours outputs from its own family.

dataset_id: REPLACE_WITH_DATASET_ID   # from `evalloop feedback build`
strategy: dpo

base_model: Qwen/Qwen2.5-7B-Instruct
base_revision: main                   # pin it; a bare name can point at new weights

lora:
  rank: 16
  alpha: 32
  dropout: 0.05

epochs: 1.0
learning_rate: 1.0e-4
batch_size: 4
gradient_accumulation_steps: 4
max_seq_length: 2048
seed: 42

# Both guards exist because the failure is silent: a run on 12 pairs, or on
# targets cut off mid-sentence, completes happily and yields a candidate that
# looks trained and is not.
min_rows: 50
max_truncated_fraction: 0.05
