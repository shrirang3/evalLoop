# Checks that run against a support-bot snapshot.
#
# Two deterministic, three judged. The deterministic half is the important one:
# a judge cannot game a JSON parser, which is what makes it admissible as the
# floor of a promotion gate (plan/001 section 3.2.1).
#
# Read the first two together. `tool_registry_check` needs no ground truth, so
# it returns a verdict on every trace a customer actually has.
# `tool_call_match` needs a recorded target, so on production traces it returns
# `not applicable` and the gate floor it was supposed to provide does not
# exist. That is the gap plan/002 closes: the registry is config the team
# already wrote, and ground truth is a column nobody emits.

suite: support-bot-v1
description: Tool-call legality and selection, plus policy and escalation judgements

evaluators:
  # ---- deterministic, no ground truth needed -----------------------------
  # Reads tools.yaml. Catches: a tool that does not exist, a tool called from a
  # node that may not call it, arguments that do not match the declared schema,
  # and a side-effecting call repeated verbatim (two identical refunds is two
  # refunds).
  - id: tool_registry_check
    type: tool_registry_check
    actual: output.tool_calls

  # ---- deterministic, ground truth required ------------------------------
  # Retained for scenario packs - cases the team authored, where they genuinely
  # know the answer. On a production trace with no `expected_tool_calls`
  # column this reports `not applicable`, which is honest and is also why it
  # cannot be the only tool check in the suite.
  - id: tool_call_match
    type: json_match
    actual: output.tool_calls
    expected: ground_truth.tool_calls
    options:
      # Two calls in a different order have the same effect, so ordering is
      # not a failure.
      ignore_order: true
      # The database returns order_id 42; the model emits "42". Same order.
      coerce_types: true
      # `{"note": null}` and `{}` say the same thing.
      treat_null_as_missing: true
      # The model passing an extra optional argument is not wrong.
      allow_extra_arguments: false

  # A coarser version of the same question: did it reach for the right tool,
  # ignoring the arguments? The pair is instructive in both directions.
  #
  # sb-0421 calls cancel_order correctly and then also issues a refund, so this
  # passes while tool_call_match fails. Two checks disagreeing like that is
  # usually where the interesting failure is.
  #
  # And it shows why the list-level check is the one that belongs in a gate:
  # an indexed path cannot see an empty list. On sb-0433 the agent called no
  # tool at all, so `output.tool_calls[0].name` does not resolve and this
  # reports "not applicable" - while tool_call_match compares [] against the
  # expected call and correctly reports a failure.
  - id: tool_name_match
    type: exact_match
    actual: output.tool_calls[0].name
    expected: ground_truth.tool_calls[0].name
    options:
      lower: true

  # ---- judged -----------------------------------------------------------
  # The judge is shown the catalogue and the customer's message, and picks a
  # tool. It is never shown the call that happened - a judge shown a decision
  # rationalises it, which is the anchoring failure plan/001 section 6.2
  # forbids for human labellers, for the same reason (plan/002 section 3).
  #
  # Its answer is a *computed* target where ground truth would have been a
  # stored one, so the verdict is set membership: every tool actually called
  # has to appear in the judge's `acceptable` list. Equality against a single
  # `best` would fail the model for picking a defensible alternative, and a
  # false failure is the expensive direction (plan/001 section 5.3).
  - id: tool_selection
    type: tool_selection
    judge: default
    request: input.user_request
    actual: output.tool_calls
    policy: >-
      Refunds are permitted within 30 days of purchase. Outside that window, a
      damaged or faulty item qualifies for a warranty replacement instead of a
      refund.
    system_prompt: >-
      You choose the correct tool for a customer-support request. Decide from
      the request and the policy alone. Prefer a read-only tool when the
      request does not clearly call for a state change.

  - id: policy_followed
    type: llm_question
    judge: default
    system_prompt: >-
      You audit customer-support transcripts against a written policy.
      Answer only from the transcript. Do not speculate about intent.
    question: |
      Acme's refund policy: refunds are permitted within 30 days of purchase.
      Outside that window, a damaged item qualifies for a warranty replacement
      instead of a refund.

      Customer said:
      {{ request }}

      Agent replied:
      {{ reply }}

      Tools the agent called:
      {{ tools }}

      Did the agent follow the refund policy?
    inputs:
      request: input.user_request
      reply: output.text
      tools: output.tool_calls
    response_schema:
      type: object
      properties:
        answer:
          type: boolean
        reason:
          type: string
      required: [answer, reason]
    matcher: boolean
    # A human verdict exists on some traces. Where it does, this question is
    # calibrated; where it does not, the answer is still recorded but cannot
    # support an absolute claim.
    ground_truth: ground_truth.policy_followed

  - id: escalation_correct
    type: llm_question
    judge: default
    question: |
      Customer said:
      {{ request }}

      Agent replied:
      {{ reply }}

      A conversation should be escalated to a human when the customer
      threatens legal action, reports property damage, or has asked the same
      question three or more times.

      Did the agent handle escalation correctly?
    inputs:
      request: input.user_request
      reply: output.text
    response_schema:
      type: object
      properties:
        answer:
          type: boolean
        reason:
          type: string
      required: [answer, reason]
    matcher: boolean
    # Held out: scored at the promotion gate, never compiled into training
    # data, so the judge's opinion of it still carries information even though
    # the same judge minted the training pairs (plan/001 section 3.2.2).
    holdout: true
