[project]
name = "evalloop"
version = "0.0.1"
description = "A configurable evaluation and improvement control plane for AI products"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Shrirang Mahankaliwar" }]
keywords = ["llm", "evaluation", "llm-judge", "fine-tuning", "dpo", "sft", "voice-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyarrow>=16.0",
    "jinja2>=3.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.12",
    "trl>=0.9",
    "accelerate>=0.33",
    "datasets>=2.20",
    "bitsandbytes>=0.43; platform_system == 'Linux'",
]
report = [
    "matplotlib>=3.9",
]
redact = [
    "spacy>=3.7",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.11",
    "respx>=0.21",
]

[project.scripts]
evalloop = "evalloop.cli.main:app"

[project.urls]
Repository = "https://github.com/shrirang3/evalLoop"
Issues = "https://github.com/shrirang3/evalLoop/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalloop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["trl.*", "peft.*", "transformers.*", "datasets.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the docker-compose stack (postgres + seeded source db)",
    "gpu: requires a CUDA device",
]
